<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه سفارش غذا</title>
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- هدر -->
    <header class="header">
        <div class="container">
            <h1><span class="header-emoji">🍽️</span> سامانه سفارش غذا</h1>
            <nav>
                <button id="loginBtn" class="btn btn-primary">ورود</button>
                <button id="registerBtn" class="btn btn-secondary">ثبت‌نام</button>
                <button id="logoutBtn" class="btn btn-danger" style="display:none;">خروج</button>
            </nav>
        </div>
        <div class="scallop-trim" aria-hidden="true"></div>
    </header>

    <main class="container">
        <!-- فرم‌های احراز هویت -->
        <section id="authSection">
            <div id="loginForm" class="form-container">
                <h2>ورود</h2>
                <form id="login">
                    <input type="email" id="loginEmail" placeholder="ایمیل" required>
                    <input type="password" id="loginPassword" placeholder="رمز عبور" required>
                    <button type="submit" class="btn btn-primary">ورود</button>
                </form>
            </div>
            <div id="registerForm" class="form-container" style="display:none;">
                <h2>ثبت‌نام</h2>
                <form id="register">
                    <input type="text" id="regName" placeholder="نام کامل" required>
                    <input type="email" id="regEmail" placeholder="ایمیل" required>
                    <input type="password" id="regPassword" placeholder="رمز عبور" required>
                    <select id="regRole">
                        <option value="user">کاربر عادی</option>
                        <option value="admin">مدیر</option>
                    </select>
                    <button type="submit" class="btn btn-primary">ثبت‌نام</button>
                </form>
            </div>
        </section>

        <!-- منوی غذاها -->
        <section id="menuSection">
            <h2>📋 منوی غذاها</h2>
            <div class="menu-actions">
                <button id="showAddMenu" class="btn btn-success" style="display:none;">➕ افزودن غذای جدید</button>
            </div>
            <div id="menuItems" class="menu-grid">
                <p style="text-align:center;padding:20px;color:#666;">در حال بارگذاری منو...</p>
            </div>
        </section>

        <!-- فرم افزودن غذا (فقط ادمین) -->
        <section id="addMenuForm" class="form-container" style="display:none;">
            <h2>افزودن غذای جدید</h2>
            <form id="addMenu">
                <input type="text" id="menuName" placeholder="نام غذا" required>
                <textarea id="menuDesc" placeholder="توضیحات" required></textarea>
                <input type="number" id="menuPrice" placeholder="قیمت" step="0.01" required>
                <input type="text" id="menuCategory" placeholder="دسته‌بندی" required>
                <input type="file" id="menuImage" accept="image/*">
                <label>
                    <input type="checkbox" id="menuAvailable" checked>
                    موجود است
                </label>
                <button type="submit" class="btn btn-success">ذخیره</button>
                <input type="hidden" id="editingItemId" value="">
                <input type="hidden" id="editingItemImage" value="">
                <button type="button" id="cancelAddMenu" class="btn btn-secondary">لغو</button>
            </form>
        </section>

        <!-- سبد خرید -->
        <section id="cartSection">
            <h2>🛒 سبد خرید</h2>
            <div id="cartItems">
                <p>سبد خرید خالی است</p>
            </div>
            <div id="cartTotal">جمع کل: <span id="totalPrice">۰</span> تومان</div>
            <button id="checkoutBtn" class="btn btn-primary">ثبت سفارش</button>
        </section>

        <!-- سفارشات (فقط وقتی وارد شده باشی نشون داده می‌شه) -->
        <section id="ordersSection" style="display:none;">
            <h2 id="ordersTitle">📦 سفارشات من</h2>
            <div id="orderFilters" class="order-filters" style="display:none;">
                <button class="filter-btn active" data-status="">همه</button>
                <button class="filter-btn" data-status="pending">در انتظار</button>
                <button class="filter-btn" data-status="completed">تکمیل شده</button>
                <button class="filter-btn" data-status="cancelled">لغو شده</button>
            </div>
            <div id="ordersList">
                <p style="color:#666;">هیچ سفارشی ثبت نشده است</p>
            </div>
        </section>
    </main>

    <!-- ============ فوتر ============ -->
   <footer class="footer">
        <div class="container">
            <h3 class="footer-title">
                🚀 طراحی و توسعه توسط <strong>سجاد خزایی</strong>
            </h3>

            <p class="footer-text">
                Full Stack Developer | Passionate about Web Development 💻
            </p>

            <a class="github-link"
            href="https://github.com/sejoo-mp"
            target="_blank"
            rel="noopener noreferrer">
                <i class="fab fa-github"></i>
                <span>GitHub: <strong>sejoo-mp</strong></span>
            </a>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
